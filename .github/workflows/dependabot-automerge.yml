name: Dependabot auto-merge

# dependabot の PR を、その PR に付いた全チェックが緑になった時点で squash マージする。
#
# 【なぜ要るか】PR を人がさばかない運用にしている。放置すると更新が溜まる一方で、しかも
# 「開いたまま」は安全側ではない。2026-08-21 時点で org 全体に 16 本が滞留し、うち
# chrome-todo の 4 本は high 深刻度の脆弱性修正だった（nanoid / postcss / rollup / vite）。
#
# 【なぜ workflow_run 起動か】pull_request 起動ではチェックが終わる前に走ってしまう。
# schedule 起動は private リポの無料枠を食う（毎時 × 10 リポで 2,000 分/月を超える）。
# チェックの完了イベントで起きるのが、即時かつ安価な唯一の方法。
#
# 【なぜ gh pr merge --auto を使わないか】このプランでは Allow auto-merge が使えず、
# ruleset も 403 で作れない＝ required status checks を設定できない。待つべき gate が
# 無いので --auto は【即時マージ】に退行する（kintone-plugin #37 で実証済み）。
# だから緑の確認をこのワークフロー自身で行う。
#
# 【zizmor: dangerous-triggers は想定内・レビュー済み】PR のコードを checkout も実行も
# しない。API でメタデータだけを読み、--match-head-commit で「チェックが通ったのと同一
# コミット」に限定してマージするので、攻撃者が制御するコードが特権コンテキストで走ることはない。
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ['Actions Security Audit (zizmor)']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # gh pr checks は statusCheckRollup を読む。permissions を明示すると未指定のスコープは
  # none になるので、これが無いとチェックが 0 件に見えて永久にマージされない
  # (実測: chrome-todo #1 は CI が緑なのに「チェックを 1 件も取得できない」で止まった)。
  checks: read
  statuses: read

jobs:
  automerge:
    name: Merge green dependabot PRs
    # pull_request 起因の完了だけを見る（main への push では動かさない）。
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge if every check is green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # checkout していないので gh は git からリポジトリを推定できない。
          # GH_REPO を明示しないと `fatal: not a git repository` で全部失敗する。
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # workflow_run.pull_requests は空で来ることがあるので head SHA から引き直す。
          pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
                 --jq '[.[] | select(.state == "open")][0] // empty')
          if [ -z "$pr" ]; then
            echo "この SHA に対応する open PR が無い -> 何もしない"
            exit 0
          fi

          NUMBER=$(jq -r '.number' <<<"$pr")
          AUTHOR=$(jq -r '.user.login' <<<"$pr")
          TITLE=$(jq -r '.title' <<<"$pr")

          # 作成者は event の actor ではなく API から確認する（より確実）。
          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "作成者が $AUTHOR で dependabot ではない -> 何もしない"
            exit 0
          fi

          # チェックの取得は REST の check-runs を直接読む。`gh pr checks` は gh の版で
          # 使える --json フィールドが変わるうえ、失敗しても JSON を出さずに終わるため、
          # 「エラー」と「チェックが 0 件」を区別できない（実測: chrome-todo #1 で
          # 権限を足した後も 0 件のままだった）。API なら生の応答をログに残せる。
          #
          # チェックの登録は run の完了からわずかに遅れることがあるので数回だけ待つ。
          checks=""
          for attempt in 1 2 3; do
            if checks=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs" \
                          --jq '[.check_runs[] | {name, status, conclusion}]'); then
              n=$(jq 'length' <<<"$checks")
              if [ "$n" -gt 0 ]; then break; fi
              echo "($attempt 回目) チェックがまだ 0 件 -> 10 秒待つ"
            else
              echo "($attempt 回目) check-runs の取得に失敗 -> 10 秒待つ"
              checks=""
            fi
            sleep 10
          done

          if [ -z "$checks" ]; then
            echo "check-runs API から応答が得られない -> マージしない"
            exit 0
          fi
          echo "取得したチェック: $checks"

          # 自分自身（workflow_run 起動）が将来チェックとして現れても、自分の完了を待って
          # 永久に止まらないよう名前で除外しておく。
          checks=$(jq '[.[] | select(.name != "Merge green dependabot PRs")]' <<<"$checks")

          total=$(jq 'length' <<<"$checks")
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$checks")
          broken=$(jq '[.[] | select(.status == "completed")
                            | select(.conclusion != "success" and .conclusion != "neutral"
                                     and .conclusion != "skipped")] | length' <<<"$checks")
          echo "#$NUMBER $TITLE -> チェック $total 件 / 未完了 $pending / 赤 $broken"

          # チェックが 1 件も取れないのは「全部緑」ではなく「確認できていない」。
          # gh の一時的な失敗で無検証マージに倒れないよう、ここは安全側に止める。
          if [ "$total" -eq 0 ]; then
            echo "チェックを 1 件も取得できない -> マージしない"
            exit 0
          fi
          if [ "$pending" -ne 0 ]; then
            echo "まだ走っているチェックがある -> 最後の 1 本が終わった時に再度起動される"
            exit 0
          fi
          if [ "$broken" -ne 0 ]; then
            echo "赤いチェックがある -> マージしない"
            exit 0
          fi

          # --match-head-commit で「チェックが通ったのと同じコミット」以外へのマージを拒否する。
          # チェック完了後に dependabot が追加 push（rebase 等）していた場合、未検証の HEAD を
          # 取り込まずにここで失敗する。--auto は使わない（上のコメント参照）。
          # マージ自体の失敗（他の PR が先に入ったことによる競合、チェック完了後の
          # 追加 push など）でこの run を赤くしない。赤くすると ops/watchdog.yml が
          # [watchdog] issue を立ててしまい、人が見るべきものだけを通知する原則が崩れる。
          # dependabot は base が動けば自動で rebase するので、次の緑で再試行される。
          if ! out=$(gh pr merge "$NUMBER" --squash --match-head-commit "$SHA" 2>&1); then
            echo "::notice::#$NUMBER のマージに失敗した（競合か HEAD の変化）。rebase 後に再試行される"
            echo "$out"
            exit 0
          fi
          echo "#$NUMBER をマージした"
