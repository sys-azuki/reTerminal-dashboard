name: Dependabot auto-merge

# dependabot・Renovate の PR を、その PR に付いた全チェックが緑になった時点で squash マージする。
#
# 【なぜ要るか】PR を人がさばかない運用にしている。放置すると更新が溜まる一方で、しかも
# 「開いたまま」は安全側ではない（滞留する中に脆弱性修正も混じる）。
#
# 【なぜ workflow_run 起動か】pull_request 起動ではチェックが終わる前に走ってしまう。
# PR で走るワークフローの完了ごとに起き、最後の 1 本が終わったときに全部緑ならマージする。
#
# 【なぜ gh pr merge --auto を使わないか】このプランでは Allow auto-merge が使えず、
# ruleset も 403 で作れない＝ required status checks を設定できない。待つべき gate が
# 無いので --auto は【即時マージ】に退行する。
# だから緑の確認をこのワークフロー自身で行う。
#
# 【zizmor: dangerous-triggers は想定内・レビュー済み】PR のコードを checkout も実行も
# しない。API でメタデータだけを読み、--match-head-commit で「チェックが通ったのと同一
# コミット」に限定してマージするので、攻撃者が制御するコードが特権コンテキストで走ることはない。
on: # zizmor: ignore[dangerous-triggers]
  workflow_run: # zizmor: ignore[dangerous-triggers]
    # PR で走るワークフローの name: をすべて並べる（最後に終わるチェックの完了で起きるため）
    workflows:
      - 'Actions Security Audit (zizmor)'
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # gh pr checks は statusCheckRollup を読む。permissions を明示すると未指定のスコープは
  # none になるので、これが無いとチェックが 0 件に見えて永久にマージされない
  # (実測: chrome-todo #1 は CI が緑なのに「チェックを 1 件も取得できない」で止まった)。
  checks: read
  statuses: read
  actions: write # マージ後に検証系ワークフローを workflow_dispatch で起こすため

jobs:
  automerge:
    name: Merge green dependabot PRs
    # workflow_run は pull_request 起因の完了だけを見る（main への push では動かさない）。
    # HOSTED_RUNNER がある間はマージしない。解除後に残った必須チェックの skipped は下で再実行する。
    if: >-
      !vars.HOSTED_RUNNER && (
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
      )
    # if を通った起動だけを同じ head SHA で直列にし、待っている有効な起動を最新の 1 つだけ残す。
    concurrency:
      group: dependabot-automerge-${{ github.event.workflow_run.head_sha || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 既定の 360 分だと、止まったときに runner を 6 時間ふさぐ
    steps:
      - name: Merge if every check is green
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # checkout していないので gh は git からリポジトリを推定できない。
          # GH_REPO を明示しないと `fatal: not a git repository` で全部失敗する。
          GH_REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          REQUIRED_CHECKS: "[]"
        run: |
          set -euo pipefail

          MERGED=""
          # 1 つの PR（head の SHA）を見て、緑ならマージする。止めるときは return 0
          try_merge() {
          local SHA=$1 pr NUMBER AUTHOR TITLE checks n attempt total pending broken skipped out
          local unready skipped_runs run_id run_api run
          # workflow_run.pull_requests は空で来ることがあるので head SHA から引き直す。
          pr=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" \
                 --jq '[.[] | select(.state == "open")][0] // empty') \
            || { echo "$SHA の PR の取得に失敗 -> 何もしない"; return 0; }
          if [ -z "$pr" ]; then
            echo "$SHA に対応する open PR が無い -> 何もしない"
            return 0
          fi

          NUMBER=$(jq -r '.number' <<<"$pr")
          AUTHOR=$(jq -r '.user.login' <<<"$pr")
          TITLE=$(jq -r '.title' <<<"$pr")

          # 作成者は event の actor ではなく API から確認する（より確実）。
          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "$AUTHOR" != "renovate[bot]" ]; then
            echo "作成者が $AUTHOR で dependabot・renovate ではない -> 何もしない"
            return 0
          fi

          pr_is_small() {
            jq -e '
              def trim: gsub("\\A\\s+|\\s+\\z"; "");
              def digest: test("^[0-9a-f]{7,40}$"; "i");
              def version_numbers: [scan("[0-9]+")] | .[:2];
              def change_is_small($old; $new):
                if ($old | digest) and ($new | digest) then true
                else
                  ($old | version_numbers) as $a
                  | ($new | version_numbers) as $b
                  | ($a | length) > 0 and $a[0] == $b[0]
                    and ($a[0] != "0" or $a[1] == $b[1])
                end;

              def from_to:
                "(?:[0-9a-f]{7,40}|v?[0-9]+(?:\\.[0-9]+)*(?:[-+][\\w.+-]+)?)" as $version
                | [capture("\\bfrom\\s+`?(?<old>" + $version + ")`?\\s+to\\s+`?(?<new>"
                           + $version + ")`?(?=\\s|\\z|\\.(?=\\s|\\z))"; "ig")];
              def dependabot_is_small($title; $body):
                # リリースノートやコメントを除いてから、概要と依存ごとの更新行を読む。
                ($body | gsub("<details\\b[\\s\\S]*?</details\\s*>|<!--[\\s\\S]*?-->"; "i")
                       | trim | split("\n")) as $lines
                | [$lines[] | select(test("^Updates\\s"; "i")) | from_to] as $updates
                | [$title, ($lines[0] // "")] as $headings
                | [$headings[] | capture("\\bgroup\\b.*?\\bwith\\s+(?<count>[0-9]+)\\s+updates?\\b"; "i")
                               | .count | tonumber] as $counts
                | ([$headings[] | from_to[]] + [$updates[][]]) as $changes
                | all($counts[]; . == ($updates | length))
                  and all($updates[]; length > 0)
                  and ($changes | length) > 0
                  and all($changes[]; change_is_small(.old; .new));

              def cells:
                trim | gsub("^\\||\\|$"; "") | split("(?<!\\\\)\\|"; "") | map(trim);
              def change_cell_is_small:
                gsub("\\]\\(.*?\\)$"; "]")
                | if startswith("[") and endswith("]") then .[1:-1] else . end
                | any(capture("^`(?<old>[^`]+)`\\s*(?:→|->)\\s*`(?<new>[^`]+)`$");
                      change_is_small((.old | trim); (.new | trim)));
              def table_is_small:
                .[0] as $columns
                | ($columns | map(ascii_downcase) | indices(["change"])) as $change
                | ($change | length) == 1
                  and length >= 3
                  and (.[1] | length) == ($columns | length)
                  and all(.[1][]; test("^:?-+:?$"))
                  and all(.[2:][];
                    length == ($columns | length)
                    and (.[$change[0]] | change_cell_is_small));
              def renovate_is_small($title; $body; $labels):
                ($title | test("\\(major\\)|\\bto v[0-9]+\\b(?![.\\w-])"; "i") | not)
                and all($labels[]; .name | test("major$"; "i") | not)
                and (
                  $body | split("(?:\\A|(?<=\n))(?:---|### Release Notes)[[:blank:]\\r]*(?=\n|\\z)"; "i") | .[0]
                  # 表の Change 列を全行読む。Update 列があっても版の組で判定する。
                  | [scan("(?:\\A|(?<=\n))[[:blank:]]*\\|[^\n]*(?:\n[[:blank:]]*\\|[^\n]*)*")
                     | split("\n") | map(cells)
                     | select(.[0] | map(ascii_downcase) | any(. == "package" or . == "change"))]
                  | length > 0 and all(.[]; table_is_small)
                );

              (.body // "") as $body
              | if .user.login == "dependabot[bot]" then dependabot_is_small(.title; $body)
                else renovate_is_small(.title; $body; .labels // [])
                end
            ' <<<"$1" >/dev/null
          }

          # 人が見る更新は run を赤くせず、watchdog の失敗通知を増やさない。
          if ! pr_is_small "$pr"; then
            echo "major 更新を含むか、版を読めない -> マージしない（人が見る）"
            return 0
          fi

          # チェックの取得は REST の check-runs を直接読む。`gh pr checks` は gh の版で
          # 使える --json フィールドが変わるうえ、失敗しても JSON を出さずに終わるため、
          # 「エラー」と「チェックが 0 件」を区別できない。API なら生の応答をログに残せる。
          #
          # チェックの登録は run の完了からわずかに遅れることがあるので数回だけ待つ。
          checks=""
          for attempt in 1 2 3; do
            # 既定は 30 件だけ。--paginate はページごとに配列を出すので jq -s で 1 つにまとめる
            # 既定の filter=latest で、再実行前の古い結果を判定に持ち越さない。
            if checks=$(gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" \
                          --jq '[.check_runs[] | {name, status, conclusion, details_url}]' | jq -cs 'add // []'); then
              n=$(jq 'length' <<<"$checks")
              if [ "$n" -gt 0 ]; then break; fi
              echo "($attempt 回目) チェックがまだ 0 件 -> 10 秒待つ"
            else
              echo "($attempt 回目) check-runs の取得に失敗 -> 10 秒待つ"
              checks=""
            fi
            sleep 10
          done

          if [ -z "$checks" ]; then
            echo "check-runs API から応答が得られない -> マージしない"
            return 0
          fi
          echo "取得したチェック: $checks"

          # 自分自身（workflow_run 起動）が将来チェックとして現れても、自分の完了を待って
          # 永久に止まらないよう名前で除外しておく。
          checks=$(jq '[.[] | select(.name != "Merge green dependabot PRs")]' <<<"$checks")

          total=$(jq 'length' <<<"$checks")
          pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$checks")
          broken=$(jq '[.[] | select(.status == "completed")
                            | select(.conclusion != "success" and .conclusion != "neutral"
                                     and .conclusion != "skipped")] | length' <<<"$checks")
          skipped=$(jq '[.[] | select(.status == "completed" and .conclusion == "skipped")] | length' <<<"$checks")
          echo "#$NUMBER $TITLE -> チェック $total 件 / 未完了 $pending / 赤 $broken / 飛ばした $skipped"

          # チェックが 1 件も取れないのは「全部緑」ではなく「確認できていない」。
          # gh の一時的な失敗で無検証マージに倒れないよう、ここは安全側に止める。
          if [ "$total" -eq 0 ]; then
            echo "チェックを 1 件も取得できない -> マージしない"
            return 0
          fi
          unready=$(jq -c --argjson required "$REQUIRED_CHECKS" '
            . as $checks
            | [$required[] as $name
               | [$checks[] | select(.name == $name)] as $matches
               | select(($matches | length) == 0
                        or any($matches[]; .status != "completed" or .conclusion != "success"))
               | $name]
          ' <<<"$checks")
          if [ "$unready" != '[]' ]; then
            echo "#$NUMBER の成功を確認できない必須チェック: $unready -> マージしない"
            # 同じ run のジョブが複数 skipped でも、run ごとに 1 回だけ再実行を頼む。
            skipped_runs=$(jq -r --argjson required "$REQUIRED_CHECKS" --arg prefix "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/" '
              [.[] | select(.status == "completed" and .conclusion == "skipped")
                   | select(.name as $name | $required | index($name))
                   | (.details_url // "")
                   | select(startswith($prefix)) | ltrimstr($prefix)
                   | capture("^(?<id>[0-9]+)/job/[0-9]+(?:[?#].*)?$").id]
              | unique[]
            ' <<<"$checks")
            # GITHUB_TOKEN による再実行の完了で workflow_run が起きる保証はない。bot の rebase か次のチェック完了で見直す。
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              run_api="repos/$GH_REPO/actions/runs/$run_id"
              if ! run=$(gh api "$run_api" --jq '{head_sha, event, status, run_attempt}'); then
                echo "::notice::run $run_id の取得に失敗した"
                continue
              fi
              if jq -e --arg sha "$SHA" '
                .head_sha == $sha and .event == "pull_request" and .status == "completed" and .run_attempt == 1
              ' <<<"$run" >/dev/null; then
                gh api -X POST "$run_api/rerun" \
                  || echo "::notice::run $run_id の再実行に失敗した"
              fi
            done <<<"$skipped_runs"
            return 0
          fi
          if [ "$pending" -ne 0 ]; then
            echo "まだ走っているチェックがある -> そのワークフローの完了（on: に並べたもの）で見直す"
            return 0
          fi
          if [ "$broken" -ne 0 ]; then
            echo "赤いチェックがある -> マージしない"
            return 0
          fi

          # --match-head-commit で「チェックが通ったのと同じコミット」以外へのマージを拒否する。
          # チェック完了後に dependabot が追加 push（rebase 等）していた場合、未検証の HEAD を
          # 取り込まずにここで失敗する。--auto は使わない（上のコメント参照）。
          # マージ自体の失敗（他の PR が先に入ったことによる競合、チェック完了後の
          # 追加 push など）でこの run を赤くしない。赤くすると ops/watchdog.yml が
          # [watchdog] issue を立ててしまい、人が見るべきものだけを通知する原則が崩れる。
          # dependabot は base が動けば自動で rebase するので、次の緑で再試行される。
          if ! out=$(gh pr merge "$NUMBER" --squash --match-head-commit "$SHA" 2>&1); then
            echo "::notice::#$NUMBER のマージに失敗した（競合か HEAD の変化）。rebase 後に再試行される"
            echo "$out"
            return 0
          fi
          MERGED=true
          echo "#$NUMBER をマージした"
          }

          if [ -n "$EVENT_SHA" ]; then try_merge "$EVENT_SHA"; fi
          if [ -n "$MERGED" ]; then echo "merged=true" >> "$GITHUB_OUTPUT"; fi

      # 【GITHUB_TOKEN のマージは push イベントを起こさない】ので、このマージでは main の
      # ワークフローが 1 本も走らない。
      # pull_request の CI は base+head のマージコミットを検査しているため取り込む内容自体は
      # 検証済みだが、それだけだと ops/watchdog.yml の「壊れたら通知」の網がマージ後に効かない。
      # workflow_dispatch は例外的に GITHUB_TOKEN でも run を作るので、検証系だけ明示的に起こす。
      #
      # 【ここに deploy 系を足さないこと】顧客環境への配信が自動で走ってしまう。
      # semgrep も入れない（常に exit 0 の警告のみ＝失敗しないので watchdog の材料にならない）。
      - name: Run verification workflows on main
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # Merge step と同じ理由
        run: |
          set -euo pipefail
          for wf in zizmor.yml; do
            gh workflow run "$wf" --ref main \
              || echo "::notice::$wf の起動に失敗した。マージ自体は成功している"
          done
