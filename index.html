<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:800px; height:480px; overflow:hidden; background:#111; font-family:sans-serif; }
#bg-blur { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/e/e6/Ogi_Shirakawa-g%C5%8D%2C_Gifu%2C_Japan.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original') center/cover; filter:blur(18px); opacity:0.35; z-index:0; }
#bg-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
#bg-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
#overlay { position:absolute; bottom:0; left:0; right:0; padding:50px 20px 14px; background:linear-gradient(transparent,rgba(0,0,0,0.88)); color:white; z-index:2; text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.7); }
#title { font-size:20px; font-weight:bold; margin-bottom:4px; }
#desc { font-size:13px; opacity:0.85; line-height:1.7; margin-bottom:6px; }
#trivia { font-size:13px; opacity:1; line-height:1.6; border-top:0.5px solid rgba(255,255,255,0.8); padding-top:6px; margin-top:4px; }
</style>
</head>
<body>
<div id="bg-blur"></div>
<div id="bg-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Ogi_Shirakawa-g%C5%8D%2C_Gifu%2C_Japan.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original"></div>
<div id="overlay">
  <div id="title">白川郷</div>
  <div id="desc">白川郷</div>
  <div id="trivia">白川郷（しらかわごう）は、岐阜県北西部の庄川流域の呼称で、白山の東麓に当たる。すぐ下流の富山県南西部の五箇山と共に、合掌造りの家屋があることで名高い。
白川郷の荻町地区は合掌造りの集落で知られる。独特の景観をなす集落が評価され、1976年重要伝統的建造物群保存地区として選定、1995年には五箇山（相倉地区、菅沼地区）と共に白川郷・五箇山の合掌造り集落として、ユネスコの世界遺産（文化遺産）に登録された。</div>
</div>
</body>
</html>
