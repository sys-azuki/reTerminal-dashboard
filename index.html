<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:800px; height:480px; overflow:hidden; background:#111; font-family:sans-serif; }
#bg-blur { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/8/8e/131013_Nakasatsunai_Art_Village_Hokkaido_Japan00s3.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original') center/cover; filter:blur(18px); opacity:0.35; z-index:0; }
#bg-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
#bg-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
#overlay { position:absolute; bottom:0; left:0; right:0; padding:50px 20px 14px; background:linear-gradient(transparent,rgba(0,0,0,0.88)); color:white; z-index:2; text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.7); }
#title { font-size:20px; font-weight:bold; margin-bottom:4px; }
#desc { font-size:13px; opacity:0.85; line-height:1.7; margin-bottom:6px; }
#trivia { font-size:13px; opacity:1; line-height:1.6; border-top:0.5px solid rgba(255,255,255,0.8); padding-top:6px; margin-top:4px; }
</style>
</head>
<body>
<div id="bg-blur"></div>
<div id="bg-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/8/8e/131013_Nakasatsunai_Art_Village_Hokkaido_Japan00s3.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original"></div>
<div id="overlay">
  <div id="title">中札内美術村</div>
  <div id="desc">中札内美術村</div>
  <div id="trivia">中札内美術村（なかさつないびじゅつむら）は、北海道河西郡中札内村にある六花亭による施設。カシワの林に囲まれた敷地内には美術館やレストラン、庭園などが点在している。六花亭、中札内村、大林組は、六花の森とともに地域に根ざした施設づくりが評価され、「日本建築学会賞」学会賞（業績部門）を受賞している。</div>
</div>
</body>
</html>
