<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:800px; height:480px; overflow:hidden; background:#111; font-family:sans-serif; }
#bg-blur { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/f/f7/Nijinomatsubara.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original') center/cover; filter:blur(18px); opacity:0.35; z-index:0; }
#bg-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
#bg-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
#overlay { position:absolute; bottom:0; left:0; right:0; padding:50px 20px 14px; background:linear-gradient(transparent,rgba(0,0,0,0.88)); color:white; z-index:2; text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.7); }
#title { font-size:20px; font-weight:bold; margin-bottom:4px; }
#desc { font-size:13px; opacity:0.85; line-height:1.7; margin-bottom:6px; }
#trivia { font-size:13px; opacity:1; line-height:1.6; border-top:0.5px solid rgba(255,255,255,0.8); padding-top:6px; margin-top:4px; }
</style>
</head>
<body>
<div id="bg-blur"></div>
<div id="bg-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f7/Nijinomatsubara.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original"></div>
<div id="overlay">
  <div id="title">鏡山から捉えた虹の松原の全景、佐賀県唐津市</div>
  
  <div id="trivia">台湾（たいわん、繁体字: 臺灣／台灣; 拼音: Táiwān; 注音: ㄊㄞˊㄨㄢˉ）は、東アジアの太平洋上に位置する島。また、それを中心とした地域の名称であり、別称としてフォルモサ（葡: Formosa、繁: 福爾摩沙）がある。地域全体が中華民国の実効支配下にある一方、中華人民共和国も同地域の領有権を主張しており、外交紛争の火種となっている（台湾問題）過去に台湾海峡危機なども発生している。</div>
</div>
</body>
</html>
