<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:800px; height:480px; overflow:hidden; background:#111; font-family:sans-serif; }
#bg-blur { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/9/9f/RCA_%E2%80%99808%E2%80%99_Power_Vacuum_Tube.jpg') center/cover; filter:blur(18px); opacity:0.35; z-index:0; }
#bg-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
#bg-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
#overlay { position:absolute; bottom:0; left:0; right:0; padding:50px 20px 14px; background:linear-gradient(transparent,rgba(0,0,0,0.88)); color:white; z-index:2; text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.7); }
#title { font-size:20px; font-weight:bold; margin-bottom:4px; }
#desc { font-size:13px; opacity:0.85; line-height:1.7; margin-bottom:6px; }
#trivia { font-size:13px; opacity:1; line-height:1.6; border-top:0.5px solid rgba(255,255,255,0.8); padding-top:6px; margin-top:4px; }
</style>
</head>
<body>
<div id="bg-blur"></div>
<div id="bg-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/RCA_%E2%80%99808%E2%80%99_Power_Vacuum_Tube.jpg"></div>
<div id="overlay">
  <div id="title">RCA社製の真空管</div>
  <div id="desc">RCA社製の真空管</div>
  <div id="trivia">RCA（Radio Corporation of America、アメリカ・ラジオ会社、アールシーエー）は、アメリカ海軍の示唆に基づきオーウェン・D・ヤングが創立し、ゼネラルエレクトリックによって買収されたアメリカ合衆国のエレクトロニクス（電気機器・半導体）事業を中心とする多国籍企業。現在はアメリカ合衆国のタリスマンブランド社（Talisman Brands d.b.a Established Inc.）が所有する登録商標であり、商標使用権売却により様々な商品分野でRCAブランドの商品が販売されている。</div>
</div>
</body>
</html>
