<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:800px; height:480px; overflow:hidden; background:#111; font-family:sans-serif; }
#bg-blur { position:absolute; inset:0; background:url('https://upload.wikimedia.org/wikipedia/commons/d/d3/Enk%C5%8D-ji_in_Kyoto_Japan04-r.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original') center/cover; filter:blur(18px); opacity:0.35; z-index:0; }
#bg-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1; }
#bg-wrap img { max-width:100%; max-height:100%; object-fit:contain; }
#overlay { position:absolute; bottom:0; left:0; right:0; padding:50px 20px 14px; background:linear-gradient(transparent,rgba(0,0,0,0.88)); color:white; z-index:2; text-shadow:0 1px 6px rgba(0,0,0,0.9),0 0 12px rgba(0,0,0,0.7); }
#title { font-size:20px; font-weight:bold; margin-bottom:4px; }
#desc { font-size:13px; opacity:0.85; line-height:1.7; margin-bottom:6px; }
#trivia { font-size:13px; opacity:1; line-height:1.6; border-top:0.5px solid rgba(255,255,255,0.8); padding-top:6px; margin-top:4px; }
</style>
</head>
<body>
<div id="bg-blur"></div>
<div id="bg-wrap"><img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Enk%C5%8D-ji_in_Kyoto_Japan04-r.jpg?utm_source=ja.wikipedia.org&utm_campaign=imageinfo&utm_content=original"></div>
<div id="overlay">
  <div id="title">京都府円光寺、書院から望む十牛之庭</div>
  <div id="desc">京都府円光寺、書院から望む十牛之庭</div>
  <div id="trivia">水琴窟（すいきんくつ）は、日本庭園の装飾の一つで、手水鉢の近くの地中に作りだした空洞の中に水滴を落下させ、その際に発せられる音を反響させる仕掛けで、手水鉢の排水を処理する機能をもつ。水琴窟という名称の由来は不明である。同系統もしくは同義の言葉に洞水門（とうすいもん、どうすいもん、ほらすいもん）がある。伏鉢水門（ふせばちすいもん）、伏瓶水門（ふせがめすいもん）、摺鉢水門（すりばちすいもん）ともいう。</div>
</div>
</body>
</html>
